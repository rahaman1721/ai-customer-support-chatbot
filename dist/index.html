<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moon Bot — Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f5;
      --white: #ffffff;
      --brand: #4f46e5;
      --brand-dark: #3730a3;
      --brand-light: #eef2ff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --user-bg: #4f46e5;
      --user-text: #ffffff;
      --bot-bg: #ffffff;
      --shadow: 0 4px 24px rgba(0,0,0,.08);
      --radius: 18px;
      --font: 'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; background: var(--bg); font-family: var(--font); }

    /* ---- WRAPPER ---- */
    #root {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
    }

    .chat-card {
      width: 100%;
      max-width: 420px;
      height: 680px;
      max-height: 90vh;
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- HEADER ---- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--white);
      flex-shrink: 0;
    }

    .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn-back:hover { background: var(--bg); color: var(--brand); }
    .btn-back svg { display: block; }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-avatar svg { color: #fff; }

    .header-info { flex: 1; min-width: 0; }
    .header-name { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .header-status {
      font-size: 0.72rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
    }
    .header-status::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .header-actions { display: flex; gap: 6px; }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      text-decoration: none;
      font-size: 0.78rem;
    }
    .btn-icon:hover { background: var(--bg); color: var(--brand); }

    /* ---- HOME SCREEN ---- */
    .home-screen {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
    }

    .home-hero { text-align: center; margin-bottom: 28px; }
    .home-hero .avatar-lg {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(99,102,241,.3);
    }
    .home-hero h1 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .home-hero p { font-size: 0.88rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }

    .suggestions-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .suggestions { display: flex; flex-direction: column; gap: 8px; }
    .suggestion-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background .15s, border-color .15s, color .15s;
    }
    .suggestion-btn:hover {
      background: var(--brand-light);
      border-color: var(--brand);
      color: var(--brand);
    }
    .suggestion-btn .arrow { flex-shrink: 0; color: var(--muted); margin-left: 8px; }
    .suggestion-btn:hover .arrow { color: var(--brand); }

    .home-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .home-footer a { color: var(--brand); text-decoration: none; }
    .home-footer a:hover { text-decoration: underline; }

    /* ---- CHAT SCREEN ---- */
    .chat-screen {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* date divider */
    .date-pill {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--bg);
      border-radius: 20px;
      padding: 4px 12px;
      align-self: center;
    }

    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .msg-avatar svg { color: #fff; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .bubble p { margin: 0 0 0.5em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 1.2em; margin: 0 0 0.5em; }
    .bubble li { margin-bottom: 0.2em; }
    .bubble code { font-family: ui-monospace, monospace; font-size: 0.85em; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 4px; }
    .bubble strong { font-weight: 600; }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-radius: 18px 18px 4px 18px;
    }
    .bubble.bot {
      background: var(--bot-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 3px;
      text-align: right;
    }
    .msg-row.user .msg-time { text-align: right; }
    .msg-row:not(.user) .msg-time { text-align: left; padding-left: 36px; }

    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.84rem;
      color: #b91c1c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .error-banner button { background: none; border: none; cursor: pointer; color: #b91c1c; font-size: 1rem; line-height: 1; }

    /* ---- COMPOSER ---- */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      background: var(--white);
      flex-shrink: 0;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 10px 14px;
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      max-height: 120px;
      outline: none;
      transition: border-color .2s;
    }
    .composer textarea:focus { border-color: var(--brand); background: var(--white); }
    .composer textarea::placeholder { color: #9ca3af; }
    .btn-send {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--brand);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    .btn-send:hover:not(:disabled) { background: var(--brand-dark); transform: scale(1.05); }
    .btn-send:disabled { background: #c7d2fe; cursor: not-allowed; }
    .btn-send.stop { background: #111827; }
    .btn-send svg { color: #fff; }

    /* ---- SCROLL ---- */
    .chat-screen::-webkit-scrollbar { width: 4px; }
    .chat-screen::-webkit-scrollbar-track { background: transparent; }
    .chat-screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 480px) {
      #root { padding: 0; align-items: stretch; }
      .chat-card { max-width: 100%; border-radius: 0; height: 100%; max-height: 100%; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
const STORE = "moonbot-chat-v1";
let config = { company: "Moon Bot", supportEmail: "", supportHours: "", suggestions: [] };
let messages = [];
let busy = false;
let errMsg = "";
let abortCtrl = null;
let inputVal = "";
let view = "home"; // "home" | "chat"

try { const s = localStorage.getItem(STORE); if (s) { messages = JSON.parse(s); if (messages.length) view = "chat"; } } catch(e) {}

function saveMessages() {
  try { localStorage.setItem(STORE, JSON.stringify(messages)); } catch(e) {}
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderInline(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

function renderRich(text) {
  if (!text) return "";
  return text.split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.length > 1 && lines.every(l => /^\s*[-*•]\s/.test(l)))
      return "<ul>" + lines.map(l => `<li>${renderInline(l.replace(/^\s*[-*•]\s/, ""))}</li>`).join("") + "</ul>";
    if (lines.length > 1 && lines.every(l => /^\s*\d+[.)]\s/.test(l)))
      return "<ol>" + lines.map(l => `<li>${renderInline(l.replace(/^\s*\d+[.)]\s/, ""))}</li>`).join("") + "</ol>";
    return "<p>" + lines.map((l,i) => i > 0 ? "<br>" + renderInline(l) : renderInline(l)).join("") + "</p>";
  }).join("");
}

function timeNow() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function todayLabel() {
  return new Date().toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
}

// ---- BOT ICON ----
const botIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>`;
const botIconLg = `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>`;
const backIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>`;
const newIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;
const mailIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`;
const sendIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>`;
const stopIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;
const arrowIcon = `<svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;

function render() {
  const isChat = view === "chat";

  // Header
  const backBtn = isChat
    ? `<button class="btn-back" id="btn-back" title="Back">${backIcon}</button>`
    : "";

  const headerActions = [
    isChat
      ? `<button class="btn-icon" id="btn-new" title="New conversation">${newIcon}</button>`
      : "",
    config.supportEmail
      ? `<a class="btn-icon" href="mailto:${esc(config.supportEmail)}" title="Email support">${mailIcon}</a>`
      : ""
  ].join("");

  const header = `
    <header class="header">
      ${backBtn}
      <div class="header-avatar">${botIcon}</div>
      <div class="header-info">
        <div class="header-name">${esc(config.company)}</div>
        <div class="header-status">Online now</div>
      </div>
      <div class="header-actions">${headerActions}</div>
    </header>`;

  // Home screen
  const homeHtml = `
    <div class="home-screen">
      <div class="home-hero">
        <div class="avatar-lg">${botIconLg}</div>
        <h1>Hi there 👋</h1>
        <p>Welcome to <strong>${esc(config.company)}</strong>. Ask me anything — I'm here to help!</p>
      </div>
      <div class="suggestions-label">Common questions</div>
      <div class="suggestions">
        ${config.suggestions.map(s => `
          <button class="suggestion-btn" data-q="${esc(s)}">
            <span>${esc(s)}</span>
            ${arrowIcon}
          </button>`).join("")}
      </div>
      ${config.supportEmail ? `
        <div class="home-footer">
          Need more help? <a href="mailto:${esc(config.supportEmail)}">Email us</a>
        </div>` : ""}
    </div>`;

  // Chat screen
  const msgsHtml = messages.map((m, i) => {
    if (m.role === "user") {
      return `
        <div>
          <div class="msg-row user">
            <div class="bubble user">${esc(m.content)}</div>
          </div>
          <div class="msg-time">${m.time || ""}</div>
        </div>`;
    } else {
      const isLast = i === messages.length - 1;
      const isTyping = busy && isLast && !m.content;
      const bubbleContent = isTyping
        ? `<div class="typing-dots"><span></span><span></span><span></span></div>`
        : renderRich(m.content);
      return `
        <div>
          <div class="msg-row">
            <div class="msg-avatar">${botIcon}</div>
            <div class="bubble bot">${bubbleContent}</div>
          </div>
          ${!isTyping && m.time ? `<div class="msg-time">${m.time}</div>` : ""}
        </div>`;
    }
  }).join("");

  const errorHtml = errMsg
    ? `<div class="error-banner"><span>${esc(errMsg)}</span><button id="btn-dismiss">✕</button></div>`
    : "";

  const chatHtml = `
    <div class="chat-screen" id="chat-screen">
      <div class="date-pill">${todayLabel()}</div>
      ${msgsHtml}
      ${errorHtml}
      <div id="end-ref"></div>
    </div>`;

  // Composer
  const sendBtn = busy
    ? `<button class="btn-send stop" id="btn-stop" type="button">${stopIcon}</button>`
    : `<button class="btn-send" id="btn-send" type="submit" ${!inputVal.trim() ? "disabled" : ""}>${sendIcon}</button>`;

  const composer = `
    <form class="composer" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Type your message…" aria-label="Your message">${esc(inputVal)}</textarea>
      ${sendBtn}
    </form>`;

  document.getElementById("root").innerHTML = `
    <div class="chat-card">
      ${header}
      ${isChat ? chatHtml : homeHtml}
      ${composer}
    </div>`;

  // Events
  document.getElementById("btn-back")?.addEventListener("click", () => {
    view = "home";
    render();
  });

  document.getElementById("btn-new")?.addEventListener("click", () => {
    if (abortCtrl) abortCtrl.abort();
    messages = []; errMsg = ""; inputVal = "";
    saveMessages();
    view = "home";
    render();
  });

  document.getElementById("btn-dismiss")?.addEventListener("click", () => {
    errMsg = ""; render();
  });

  document.getElementById("btn-stop")?.addEventListener("click", () => {
    abortCtrl?.abort();
  });

  document.querySelectorAll(".suggestion-btn").forEach(btn => {
    btn.addEventListener("click", () => send(btn.dataset.q));
  });

  const form = document.getElementById("chat-form");
  form?.addEventListener("submit", e => { e.preventDefault(); send(inputVal); });

  const ta = document.getElementById("chat-input");
  if (ta) {
    ta.addEventListener("input", e => {
      inputVal = e.target.value;
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
      const sb = document.getElementById("btn-send");
      if (sb) sb.disabled = !inputVal.trim();
    });
    ta.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(inputVal); }
    });
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    if (isChat) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
  }

  // Scroll to bottom
  if (isChat) {
    setTimeout(() => {
      const el = document.getElementById("end-ref");
      el?.scrollIntoView({ behavior: "smooth", block: "end" });
    }, 50);
  }
}

async function send(text) {
  const content = text.trim();
  if (!content || busy) return;
  errMsg = "";
  inputVal = "";
  view = "chat";
  const t = timeNow();
  const next = [...messages, { role: "user", content, time: t }];
  messages = [...next, { role: "assistant", content: "", time: "" }];
  busy = true;
  saveMessages();
  render();

  abortCtrl = new AbortController();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      signal: abortCtrl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: next.map(m => ({ role: m.role, content: m.content })) }),
    });
    if (!res.ok) {
      let j = {}; try { j = await res.json(); } catch(e) {}
      throw new Error(j.error || "Something went wrong. Please try again.");
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", acc = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
          if (delta) {
            acc += delta;
            messages[messages.length - 1] = { role: "assistant", content: acc, time: timeNow() };
            render();
          }
        } catch(e) {}
      }
    }
    if (!acc) throw new Error("No reply came back. Try sending again.");
  } catch(e) {
    if (e.name !== "AbortError") {
      errMsg = e.message;
      if (messages.length && messages.at(-1).role === "assistant" && !messages.at(-1).content)
        messages = messages.slice(0, -1);
    }
  } finally {
    busy = false;
    abortCtrl = null;
    saveMessages();
    render();
  }
}

// Boot
fetch("/api/config")
  .then(r => r.json())
  .then(d => { config = d; render(); })
  .catch(() => render());
</script>
</body>
</html>
